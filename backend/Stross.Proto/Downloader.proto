syntax = "proto3";

option csharp_namespace = "Stross.Proto";

service Downloader {
  rpc DownloadMusicTrack (DownloadMusicTrackRequest) returns (DownloadMusicTrackReply);
  rpc GetCreatorMetadata (GetCreatorMetadataRequest) returns (GetCreatorMetadataReply);
  rpc Ping (PingRequest) returns (PingReply);
  rpc SanitizeSourceUrl (SanitizeSourceUrlRequest) returns (SanitizeSourceUrlReply);
}

message DownloadMusicTrackRequest {
  string sourceUrl = 1;
  string targetLocationPath = 2;
}

message DownloadMusicTrackReply {
  bool succeeded = 1;
  string error = 2;

  string sourceUrl = 3;
  string title = 4;
  repeated string creatorIds = 5;
  string musicTrackPath = 6;
  string thumbnailPath = 7;
}

message GetCreatorMetadataRequest {
  string creatorId = 1;
}

message GetCreatorMetadataReply {
  bool succeeded = 1;
  string error = 2;

  string creatorId = 3;
  string creatorName = 4;
  string creatorUrl = 5;
  string creatorThumbnailImageUrl = 6;
}

message PingRequest {
  
}

message PingReply {
  bool ready = 1;
}

message SanitizeSourceUrlRequest {
  string sourceUrl = 1;
}

message SanitizeSourceUrlReply {
  bool succeeded = 1;
  string error = 2;

  string sanitizedUrl = 3;
}